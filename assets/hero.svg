<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Danushmathi P — hen on a nest laying a golden egg</title>
  <desc id="d">An animated hen sits on a straw nest and lays a golden egg that rolls to join the others.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDE8F4"/>
      <stop offset="0.62" stop-color="#F3F1D9"/>
      <stop offset="1" stop-color="#FFE9AE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset="1" stop-color="#F2B92E"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="360" rx="26"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .cloud { animation: drift 70s linear infinite; }
    @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(1180px); } }
    .halo { transform-box: fill-box; transform-origin: center; animation: glow 5s ease-in-out infinite; }
    @keyframes glow { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.15); opacity: .35; } }

    .hen { transform-box: fill-box; transform-origin: 50% 100%; animation: sit 8s ease-in-out infinite; }
    @keyframes sit {
      0%,8%   { transform: translateY(0) scale(1,1); }
      11%,15% { transform: translateY(5px) scale(1.03,.96); }
      19%     { transform: translateY(-3px) scale(.99,1.02); }
      24%,100%{ transform: translateY(0) scale(1,1); }
    }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }

    .laid { transform-origin: center; animation: roll 8s cubic-bezier(.3,.7,.3,1) infinite; }
    @keyframes roll {
      0%,11%  { transform: translate(0,0) rotate(0deg); opacity: 0; }
      13%     { transform: translate(2px,0) rotate(0deg); opacity: 1; }
      36%     { transform: translate(110px,0) rotate(400deg); opacity: 1; }
      86%     { transform: translate(110px,0) rotate(400deg); opacity: 1; }
      93%,100%{ transform: translate(110px,0) rotate(400deg); opacity: 0; }
    }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 8s ease-out infinite; opacity: 0; }
    @keyframes spark {
      0%,35% { transform: scale(0) rotate(0deg); opacity: 0; }
      40%    { transform: scale(1.2) rotate(30deg); opacity: 1; }
      50%,100%{ transform: scale(0) rotate(60deg); opacity: 0; }
    }

    .line { opacity: 0; animation: tag 12s ease-in-out infinite; }
    @keyframes tag {
      0%   { opacity: 0; transform: translateY(8px); }
      4%,29% { opacity: 1; transform: translateY(0); }
      33%,100% { opacity: 0; transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud,.halo,.hen,.blink,.spark,.line { animation: none; }
      .laid { animation: none; opacity: 1; transform: translate(110px,0); }
      .line { opacity: 0; } .line.first { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="360" fill="url(#sky)"/>
    <circle class="halo" cx="905" cy="74" r="50" fill="#FFF3B8" opacity=".6"/>
    <circle cx="905" cy="74" r="30" fill="#FFCB47"/>

    <g class="cloud" opacity=".9"><ellipse cx="0" cy="44" rx="46" ry="13" fill="#fff"/><ellipse cx="26" cy="34" rx="28" ry="14" fill="#fff"/><ellipse cx="-24" cy="36" rx="24" ry="11" fill="#fff"/></g>
    <g class="cloud" style="animation-delay:-38s" opacity=".75"><ellipse cx="0" cy="84" rx="36" ry="10" fill="#fff"/><ellipse cx="20" cy="76" rx="22" ry="11" fill="#fff"/></g>

    <!-- ground -->
    <path d="M0 318 Q250 296 500 314 T1000 306 V360 H0 Z" fill="#B9D68C"/>
    <path d="M0 336 Q300 322 560 334 T1000 330 V360 H0 Z" fill="#9CC46E"/>

    <!-- nest, back -->
    <ellipse cx="240" cy="290" rx="176" ry="36" fill="#7A4E24"/>
    <ellipse cx="240" cy="285" rx="150" ry="26" fill="#573517"/>
    <g stroke-linecap="round" fill="none">
      <path d="M78 285 Q110 262 150 268" stroke="#A9743B" stroke-width="5"/>
      <path d="M404 284 Q372 262 330 268" stroke="#A9743B" stroke-width="5"/>
      <path d="M96 296 Q120 272 168 276" stroke="#C99A55" stroke-width="4"/>
      <path d="M386 296 Q362 272 314 276" stroke="#C99A55" stroke-width="4"/>
    </g>

    <!-- clutch (resting eggs) -->
    <g stroke="#E2CFA6" stroke-width="2">
      <ellipse cx="108" cy="282" rx="17" ry="22" fill="#FFF7E6"/>
      <ellipse cx="138" cy="292" rx="17" ry="22" fill="#EFCB93"/>
      <ellipse cx="386" cy="282" rx="17" ry="22" fill="#FFF7E6"/>
      <ellipse cx="404" cy="296" rx="16" ry="21" fill="#EFCB93" opacity="0"/>
    </g>
    <g fill="#C79A5B" opacity=".6"><circle cx="102" cy="276" r="1.6"/><circle cx="113" cy="288" r="1.4"/><circle cx="380" cy="276" r="1.6"/><circle cx="392" cy="289" r="1.4"/><circle cx="134" cy="286" r="1.4"/></g>

    <!-- the golden egg: starts hidden behind the hen, rolls out to the right -->
    <g class="laid" style="transform-box:fill-box;transform-origin:center">
      <ellipse cx="232" cy="288" rx="17" ry="22" fill="url(#gold)" stroke="#D89C1A" stroke-width="2"/>
      <ellipse cx="226" cy="280" rx="4" ry="7" fill="#fff" opacity=".55"/>
    </g>
    <g class="spark" transform="translate(342 262)">
      <path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#FFE36B"/>
    </g>

    <!-- hen -->
    <g class="hen">
      <!-- tail -->
      <g fill="#FBF5EA" stroke="#E0CFB2" stroke-width="2">
        <ellipse cx="134" cy="188" rx="13" ry="38" transform="rotate(-38 134 188)"/>
        <ellipse cx="128" cy="206" rx="13" ry="36" transform="rotate(-62 128 206)"/>
        <ellipse cx="142" cy="176" rx="12" ry="32" transform="rotate(-14 142 176)"/>
      </g>
      <!-- body, neck, head -->
      <ellipse cx="220" cy="230" rx="84" ry="58" fill="#FFFDF8" stroke="#E0CFB2" stroke-width="2"/>
      <ellipse cx="274" cy="192" rx="35" ry="44" fill="#FFFDF8"/>
      <circle cx="286" cy="160" r="31" fill="#FFFDF8" stroke="#E0CFB2" stroke-width="2"/>
      <ellipse cx="274" cy="196" rx="30" ry="36" fill="#FFFDF8"/>
      <!-- comb -->
      <g fill="#E5383B"><circle cx="276" cy="130" r="9"/><circle cx="289" cy="126" r="10"/><circle cx="302" cy="132" r="9"/></g>
      <!-- beak, wattle, face -->
      <polygon points="313,156 341,165 313,174" fill="#F5A623"/>
      <path d="M313 168 L332 168 L313 174 Z" fill="#E0900F"/>
      <ellipse cx="315" cy="186" rx="6" ry="11" fill="#E5383B"/>
      <circle cx="303" cy="170" r="6.5" fill="#FFB5A7" opacity=".65"/>
      <ellipse class="blink" cx="298" cy="154" rx="4.4" ry="4.6" fill="#2B1D14"/>
      <circle cx="299.6" cy="152.4" r="1.3" fill="#fff"/>
      <!-- wing -->
      <g transform="rotate(-8 216 236)">
        <ellipse cx="216" cy="236" rx="48" ry="30" fill="#F5E8D0" stroke="#E0CFB2" stroke-width="2"/>
        <path d="M186 238 q12 8 24 0 M204 250 q12 8 24 0 M222 236 q12 8 24 0" fill="none" stroke="#DCC9A8" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- nest, front rim (tucks the hen into the nest) -->
    <path d="M70 288 Q240 352 412 288" fill="none" stroke="#8A5A2B" stroke-width="16" stroke-linecap="round"/>
    <g fill="none" stroke-linecap="round">
      <path d="M92 296 Q170 336 250 336" stroke="#C99A55" stroke-width="4"/>
      <path d="M118 306 Q220 330 330 322" stroke="#5E3A1A" stroke-width="4"/>
      <path d="M170 322 Q290 346 396 300" stroke="#C99A55" stroke-width="4"/>
      <path d="M76 292 Q140 320 200 326" stroke="#5E3A1A" stroke-width="3"/>
      <path d="M290 332 Q360 320 408 294" stroke="#5E3A1A" stroke-width="3"/>
    </g>

    <!-- text -->
    <text class="serif" x="520" y="140" font-size="48" font-weight="700" fill="#33210F">Danushmathi P</text>
    <text x="522" y="176" font-size="18" fill="#5B3A21">MSc Data Science · University of Hertfordshire</text>
    <g font-size="24" fill="#33210F">
      <text class="line first" x="522" y="226" style="animation-delay:0s">Data scientist with full-stack skills</text>
      <text class="line" x="522" y="226" style="animation-delay:4s">Turning raw data into golden eggs</text>
      <text class="line" x="522" y="226" style="animation-delay:8s">Open to data scientist roles</text>
    </g>
  </g>
</svg>
